name: Post release to Telegram

# Posts (or re-posts) an existing release's notes to the channel by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.1"
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/telegram.py "${{ inputs.tag }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

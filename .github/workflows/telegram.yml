name: Post release to Telegram

# Posts a release's notes (tag) or any file under posts/ to the channel by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v1.2.1) or a post file (posts/guide.html)"
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/telegram.py "${{ inputs.tag }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
